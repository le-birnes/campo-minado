<!doctype html><meta charset="utf-8"><title>lattice bodies bench</title>
<body style="background:#111;color:#ddd;font:13px ui-monospace,monospace;padding:12px">
<pre id="out">running…</pre>
<script src="lattice.js"></script>
<script>
const L=[], log=s=>L.push(s);
const ms = f => { const t=performance.now(); f(); return performance.now()-t; };
const fx = (n,d=1) => n.toLocaleString('en-US',{maximumFractionDigits:d});

log('=== ON THE LATTICE — discrete bodies, and what leaving the grid costs ===');
log('');
log(`  rotations of the cube: ${ROTS.length}  (orientation is one byte, not a quaternion)`);
{
  const t = tetStamp(3);
  log(`  the shape: a right tetrahedron, ${t.length} voxels at size 3`);
  log(`  quarter turns available from any pose: ${NB[0].length}`);
  /* Six of these tile a cube exactly - the claim the shape choice rests on. */
  log(`  it is the lattice's own fragment: 6 right tetrahedra fill one cube`);
}
log('');
log('--- 1. THE COST CURVE ---');
log('');
log('     n     falling ms   settled ms   moves/tick  topples  ticks to sleep  heap');
const rows=[];
let seed=20260805;
const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
const T0=performance.now();
for (const n of [100, 400, 1600, 6400, 25600]){
  if (performance.now()-T0 > 40000){ log('  (bench out of its own budget)'); break; }
  /* A SHAFT, not a wide field: they are forced to stack on each other, which
     is the case the pyramid bench never actually produced. */
  const side = Math.max(6, Math.ceil(Math.cbrt(n)*1.6));
  const w = new Lattice({g:20, w:side, d:side, sleep:8});
  w.setShape(3);
  let placed=0;
  for (let i=0;i<n*3 && placed<n;i++){
    const x=(rnd()*side)|0, z=(rnd()*side)|0, y=(6 + rnd()*n*3/(side*side))|0;
    if (w.add(x,y,z,(rnd()*24)|0) >= 0) placed++;
  }
  let t=0; for(let i=0;i<25;i++) t += ms(()=>w.step(rnd));
  const busy=t/25, mv=w.stats.moves, tn=w.stats.turns;
  let quiet=-1; const tq=performance.now();
  for (let i=0;i<4000 && performance.now()-tq<4000;i++){
    w.step(rnd);
    if (w.awake()===0){ quiet=i; break; }
  }
  let t2=0; for(let i=0;i<25;i++) t2 += ms(()=>w.step(rnd));
  rows.push({n:placed, busy, rest:t2/25});
  log(`  ${String(placed).padStart(6)}   ${busy.toFixed(2).padStart(9)}   ${(t2/25).toFixed(2).padStart(9)}   `+
      `${String(mv).padStart(10)}  ${String(tn).padStart(7)}  `+
      (quiet>=0?String(quiet).padStart(13):'        never')+`  ${w.height()}`);
}
log('');
log('--- 2. AGAINST THE CONTINUOUS VERSION ---');
log('');
log('  poly.js, square pyramids, float pose, separating axis (74 axes a pair):');
log('       800 bodies   1.56 ms/tick   and nothing ever slept');
{
  const r = rows.find(r=>r.n>=1500) || rows[rows.length-1];
  log(`  lattice.js, tetrahedra, integer pose, occupancy only:`);
  log(`     ${fx(r.n,0)} bodies   ${r.busy.toFixed(2)} ms/tick`);
  const per = r.busy/r.n, perP = 1.56/800;
  log('');
  log(`  per body: ${(per*1000).toFixed(2)} us on the lattice against ${(perP*1000).toFixed(2)} us continuous`);
  log(`  => ${(perP/per).toFixed(1)}x cheaper, and the narrow phase is GONE - no axes, no`);
  log(`     projections, no manifold. Collision is "is that voxel taken".`);
}
log('');
log('--- 3. WHAT THE 24 ORIENTATIONS BUY ---');
log('');
log('  a quaternion is 4 floats = 32 bytes, needs renormalising every tick, and');
log('  drifts. An orientation index is ONE BYTE and cannot drift, because there');
log('  is nothing between one pose and the next. A body here is:');
log('     x,y,z int + o byte + fy fixed point = 16 bytes against ~200 continuous.');
log('');
log('=== done ===');
document.getElementById('out').textContent = L.join('\n');
document.body.dataset.r = L.join('~');
</script>
</body>
