<!doctype html><meta charset="utf-8"><title>the stir</title>
<body style="background:#111;color:#ddd;font:13px ui-monospace,monospace;padding:12px">
<pre id="out">running…</pre>
<script src="impact.js"></script>
<script>
const L=[],log=s=>L.push(s);
const ms=f=>{const t=performance.now();f();return performance.now()-t;};
const fx=(n,d=0)=>n.toLocaleString('en-US',{maximumFractionDigits:d});

log('=== THE STIR — what a hit does to the particles around it ===');
log('');
log(`  Cell ${G_CELL.toFixed(3)} m (BLOCK/16). Nothing below is tuned: the crater, the`);
log('  speed and the flight time all fall out of ONE energy and the material.');
log('');

/* ---- 0. what a pellet carries ---- */
log('--- 0. WHAT A PELLET IS CARRYING ---');
log('');
const PEL_SPD = 101;                       // the game's own pellet speed, m/s
log('     pellet mass    speed      kinetic energy');
const PELLETS=[];
for (const gr of [1.2, 2.4, 4.8]){         // grams: buckshot-ish
  const m = gr/1000, E = 0.5*m*PEL_SPD*PEL_SPD;
  PELLETS.push({gr, m, E});
  log(`     ${gr.toFixed(1)} g`.padEnd(18)+`${PEL_SPD} m/s`.padEnd(11)+`${E.toFixed(1)} J`);
}
log('');
log('  A shotgun puts several of those into the same place at once, so the');
log('  energy that matters is the pellet times how many land together.');
log('');

/* ---- 1. the crater ---- */
log('--- 1. THE CRATER: WHAT A GIVEN ENERGY CAN ACTUALLY BREAK ---');
log('');
log('  Energy in equals work done. One cell costs bind * g^3 to free, so the');
log('  crater holds however many cells the hit could pay for. The flood spends');
log('  the same budget through the real material and must agree on uniform');
log('  ground - if it did not, one of them would be lying.');
log('');
log('     material   cost of ONE cell     energy      cells   radius   flood');
const all = () => true;
for (const mat of ['sand','coal','rock','iron']){
  for (const E of [1e2, 1e4, 1e6]){
    const f = floodCrater(all, 0,0,0, mat, E);
    log(`     ${mat.padEnd(8)} ${fx(cellBreakCost(mat),1).padStart(14)} J  ${fx(E).padStart(9)} J   `+
        `${fx(cellsFreed(mat,E)).padStart(7)}   ${craterRadius(mat,E).toFixed(2).padStart(5)} m   ${fx(f.freed).padStart(6)}`);
  }
}
log('');
log('  One cell of sand is 0.175 m on a side - a shovelful - and freeing it');
log('  costs 107 J. A 2.4 g pellet at 101 m/s carries 12. So a single pellet');
log('  CANNOT MOVE ONE CELL OF SAND, and that is not a bug in the model, it is');
log('  what buckshot does to a sand bank. The model only becomes wrong if it is');
log('  asked to explain the game.');
log('');

/* ---- 2. Marcelo's own spec, checked ---- */
log('--- 2. "EACH SHOT BURNS 2 PARTICLES RADIUS" — THE BILL FOR IT ---');
log('');
log('  That number was fixed by hand long before any of this, so run it');
log('  backwards: what would a shot have to be worth to clear a 2-cell radius?');
log('');
log('     material    energy for r=2 cells      that is...');
const PEL = PELLETS[1];
const TNT = 4.6e6;                                   // J per kg
for (const mat of ['sand','coal','rock','iron']){
  const need = energyForRadius(mat, 2);
  const nPel = need/PEL.E;
  const kg   = need/TNT;
  log(`     ${mat.padEnd(9)} ${fx(need,0).padStart(16)} J   ${fx(nPel,0).padStart(10)} pellets`+
      `, or ${kg < 1 ? fx(kg*1000,0)+' g' : fx(kg,1)+' kg'} of TNT`);
}
log('');
log('  So the honest answer is that THE GAME\'S SHOT IS NOT A SHOTGUN. Clearing');
log('  two cells of rock is a stick of dynamite, not buckshot, and no amount of');
log('  tuning bind fixes that without making rock behave like foam everywhere');
log('  else. The two systems have to be bridged ON PURPOSE:');
log('');
log('     SHOT_ENERGY[material] — a declared game constant, per material, that');
log('     says what a trigger pull is worth against that stuff. Physics decides');
log('     what an energy DOES; the game decides how much of it a shot carries.');
log('');
log('  Writing it that way keeps every derived quantity below honest - crater,');
log('  speed, flight time, debris count all still come out of the energy - while');
log('  putting the one lie in a single named place instead of smearing it');
log('  through the material table where it would corrupt everything else.');
log('');
log('     material   SHOT_ENERGY for the game\'s 2-cell rule');
for (const mat of ['sand','coal','rock','iron']){
  log(`     ${mat.padEnd(9)} ${fx(energyForRadius(mat,2),0).padStart(16)} J`);
}
log('');

/* ---- 3. the throw ---- */
log('--- 3. THE THROW: HOW FAST, AND HOW LONG IT LASTS ---');
log('');
log('  Energies chosen to actually break something, so the trend is visible.');
log('');
log('     material   energy    cells freed   speed       in the air');
for (const mat of ['sand','rock']){
  for (const E of [1e4, 1e5, 1e6, 1e7]){
    const t = throwOf(mat, E);
    log(`     ${mat.padEnd(8)} ${fx(E).padStart(9)} J ${fx(t.n).padStart(11)}   `+
        `${t.speed.toFixed(1).padStart(6)} m/s   ${t.flight.toFixed(2)} s`);
  }
}
log('');
log('  The speed does NOT run away with energy: ten times the hit frees ten');
log('  times the mass, so the same share of energy is spread over ten times as');
log('  much of it and the speed is flat. A bigger hit throws MORE rubble, not');
log('  FASTER rubble - which is what an explosion looks like, and it came out of');
log('  the arithmetic rather than being asked for. Flight time is flat with it,');
log('  so debris lifetime is a property of the material, not of the hit.');
log('');

/* ---- 4. what flying them costs ---- */
log('--- 4. WHAT IT COSTS TO ACTUALLY FLY THEM ---');
log('');
log('  A freed grain is not a falling-sand cell any more: it has a velocity, so');
log('  it integrates and lands. This is the real budget — Marcelo\'s rule that');
log('  visible debris is a budget rather than a consequence.');
log('');
log('     debris in the air    ms/tick    ns per particle');
const floorY = 0;
const solid = null;
for (const n of [1000, 10000, 50000, 200000]){
  const d = new Debris(n+16);
  let s=99; const rnd=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
  for (let i=0;i<n;i++){
    const th=rnd()*Math.PI*2, ph=rnd()*Math.PI/2, v=8+rnd()*8;
    d.add(0, 40, 0, Math.cos(th)*Math.cos(ph)*v, Math.sin(ph)*v, Math.sin(th)*Math.cos(ph)*v, 0);
  }
  /* time the ticks while they are all still up, which is the worst case */
  let t=0, k=0;
  for (; k<20 && d.n>n*0.9; k++) t += ms(()=>d.step(1/60, solid, floorY));
  const per = t/Math.max(k,1);
  log(`     ${fx(n).padStart(16)}   ${per.toFixed(3).padStart(7)}   ${(per/n*1e6).toFixed(1).padStart(12)}`);
}
log('');
{
  const d = new Debris(200016);
  let s=7; const rnd=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
  for (let i=0;i<200000;i++){
    const th=rnd()*Math.PI*2, ph=rnd()*Math.PI/2, v=8+rnd()*8;
    d.add(0, 40, 0, Math.cos(th)*Math.cos(ph)*v, Math.sin(ph)*v, Math.sin(th)*Math.cos(ph)*v, 0);
  }
  let t=0, k=0;
  for (; k<20; k++) t += ms(()=>d.step(1/60, solid, floorY));
  const per=t/k;
  const budget = 4.0;                                 // ms, a physics slice
  log(`  At ${(per/200000*1e6).toFixed(1)} ns a particle, a ${budget} ms slice flies `+
      `${fx(Math.round(budget/(per/200000)/1000)*1000)} grains at once.`);
  log('');
  log('  So the cap in Debris is not a fudge, it is the frame. Past it the source');
  log('  diminishes by the rest and no particle is made: a big hit looks big');
  log('  without costing more than a small one, and the cost of a fight stops');
  log('  depending on how hard anyone swings.');
}
log('');

/* ---- 5. OUR GUN ---- */
log('--- 5. OUR GUN: A 3 g CHARGE PER PELLET, 8 AT A TIME, NO SPREAD ---');
log('');
log(`  A pellet carries ${PELLET_TNT_G} g of TNT and ${PELLETS_PER_SHOT} land together, so a shot is`);
log(`  ${PELLETS_PER_SHOT*PELLET_TNT_G} g = ${fx(shotEnergy(),0)} J. The pellet's own kinetic energy is ${PELLETS[1].E.toFixed(0)} J,`);
log('  which is kept in the model and is visibly nothing beside the charge.');
log('');
log('  NO SPREAD: the force is contained in the face that was shot, so it eats');
log(`  DEPTH out of one ${BLOCK_M} m block face (${16*16} cells) and never touches the`);
log('  blocks either side. Depth is therefore the number that matters, not radius.');
log('');
log('     material   one shot: cells   depth      shots to take a whole block');
for (const mat of ['sand','coal','rock','cinder','iron']){
  const f = faceBlast(mat, shotEnergy());
  log(`     ${mat.padEnd(9)} ${fx(f.cells).padStart(13)}   ${(f.depth*100).toFixed(1).padStart(6)} cm   `+
      `${fx(shotsForBlock(mat),1).padStart(14)}`);
}
log('');

log('--- 6. "5 SHOTS SHOULD BE ENOUGH TO DESTROY ROCK" — THE BILL ---');
log('');
log(`  Five shots is ${5*PELLETS_PER_SHOT*PELLET_TNT_G} g of TNT, ${fx(5*shotEnergy(),0)} J. A block of rock at`);
log(`  BLOCK/16 is ${fx(16*16*16)} cells and each costs ${fx(cellBreakCost('rock'),0)} J to free, so taking`);
log(`  one apart is ${fx(16*16*16*cellBreakCost('rock')/0.5,0)} J — ${fx(shotsForBlock('rock'),0)} shots, not 5.`);
log('');
log('  So the two do not meet, and it is worth being exact about WHERE. Run it');
log('  backwards: what would a material have to be bound at for 5 shots to take');
log('  a block, and what is actually that soft?');
log('');
const need5 = bindForShots(5);
log(`     5 shots takes a block if bind = ${fx(need5,0)} J/m3`);
log('');
log('     material   bind (J/m3)    shots for a block at that bind');
for (const mat of ['sand','coal','rock','cinder','iron']){
  log(`     ${mat.padEnd(9)} ${fx(IMAT[mat].bind).padStart(13)}    ${fx(shotsForBlock(mat),1).padStart(12)}`);
}
log('');
log(`  ${fx(need5,0)} J/m3 is softer than the SAND in this table. Nothing that could be`);
log('  called rock is that weak, so the spec and the physics are pointing at');
log('  different things and only one of three answers is available:');
log('');
log(`     A. THE CHARGE IS BIGGER. 5 shots takes a rock block at `+
    `${fx(16*16*16*cellBreakCost('rock')/0.5/5/(TNT_J_PER_KG/1000)/PELLETS_PER_SHOT,0)} g`);
log('        a pellet instead of 3 — a stick of dynamite per pellet, and then');
log('        one shot into sand vaporises everything for a block around.');
log('');
log('     B. ROCK IS A GAME MATERIAL, NOT A ROCK. Give the diggable stuff its');
log(`        own bind of ${fx(need5,0)} and keep 3 g. Real rock stays at 3e6 and`);
log('        stays undiggable, which is what makes it a wall. This is the one');
log('        that costs nothing elsewhere, because it changes a number in the');
log('        material table rather than the weapon everything else is sized to.');
log('');
log('     C. "DESTROY" IS NOT "REMOVE THE WHOLE BLOCK". 5 shots at 3 g bites');
log(`        ${(faceBlast('rock', 5*shotEnergy()).depth*100).toFixed(0)} cm into a ${BLOCK_M*100} cm block — a real hole, not a hole`);
log('        through. If the block should FALL once it is bitten deep enough,');
log('        that is a structural rule and the depth is already the trigger.');
log('');
log('  B is the cheapest and C is the most interesting; A breaks everything');
log('  else. This is a design call, not a measurement, so it is left open.');
log('');

log('--- 7. THE STIR, END TO END, WITH THE REAL ROUND ---');
log('');
{
  const mat='sand', E=shotEnergy();
  const f = faceBlast(mat, E);
  const th = throwOf(mat, E);
  const d = new Debris(8192);
  let s=3; const rnd=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
  /* Debris leaves along the face normal, because that is where the energy went */
  const n = Math.min(f.cells, 8192);
  for (let i=0;i<n;i++){
    const a2=rnd()*Math.PI*2, sp=th.speed*(0.5+rnd());
    d.add((rnd()-0.5)*BLOCK_M, 20+(rnd()-0.5)*BLOCK_M, (rnd()-0.5)*BLOCK_M,
          Math.cos(a2)*sp*0.35, sp*0.6, Math.sin(a2)*sp*0.35, 0);
  }
  let ticks=0, tt=0;
  while (d.n && ticks < 900){ tt += ms(()=>d.step(1/60, null, 0)); ticks++; }
  log(`  One shot (${PELLETS_PER_SHOT}x${PELLET_TNT_G} g) into a sand face — ${fx(E,0)} J.`);
  log(`     bite        ${fx(f.cells)} cells, ${(f.depth*100).toFixed(0)} cm deep, contained to one face`);
  log(`     throw       ${th.speed.toFixed(1)} m/s, ${th.flight.toFixed(2)} s of flight`);
  log(`     debris      ${fx(d.stats.spawned)} grains, ${d.stats.capped} over the cap`);
  log(`     settled     after ${ticks} ticks (${(ticks/60).toFixed(2)} s)`);
  log(`     COST        ${tt.toFixed(2)} ms for the whole flight, `+
      `${(tt/Math.max(ticks,1)).toFixed(4)} ms/tick`);
  log('');
  const you = facePush(E, 1.0, 80, 0.5);
  const close = facePush(E, 0.3, 80, 0.5);
  log(`  And it pushes: standing 1 m off the face it shoves you at ${you.toFixed(1)} m/s,`);
  log(`  at 0.3 m it is ${close.toFixed(1)} m/s, past one block it is ${facePush(E, 3.0, 80, 0.5).toFixed(1)}.`);
  log('  Firing at the floor under you is therefore a jump. Nobody asked for that;');
  log('  it falls out of the round being a charge, and it should be found on');
  log('  purpose rather than by accident.');
}
log('');
log('=== done ===');
document.getElementById('out').textContent=L.join('\n');
document.body.dataset.r=L.join('~');
</script></body>
